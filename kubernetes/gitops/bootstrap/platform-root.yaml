apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Shaggydesai/production-kubernetes-platform.git
    targetRevision: main
    path: kubernetes/gitops/argocd
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      # Deliberately NO prune at the root. Every child app has prune:true,
      # so pruning here would cascade: delete a file -> Application pruned
      # -> that app's entire workload deleted. Removing an app is a
      # deliberate manual step. See docs/adr/ADR-002-gitops.md
      selfHeal: true
