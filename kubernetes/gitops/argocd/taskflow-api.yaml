apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskflow-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Shaggydesai/production-kubernetes-platform.git
    targetRevision: feature/ubuntu-template
    path: kubernetes/applications/taskflow-api
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
