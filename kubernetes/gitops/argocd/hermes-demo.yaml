apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Shaggydesai/production-kubernetes-platform.git
    targetRevision: feature/ubuntu-template
    path: kubernetes/applications/hermes-demo
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: hermes-lab

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
