apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-metallb
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Shaggydesai/production-kubernetes-platform.git
    targetRevision: main
    path: kubernetes/platform/metallb
    helm:
      releaseName: metallb

  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true