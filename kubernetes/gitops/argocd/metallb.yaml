apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-metallb
  namespace: argocd
  labels:
    gitops-test: "true"
spec:
  project: default

  source:
    repoURL: https://github.com/Shaggydesai/production-kubernetes-platform.git
    targetRevision: feature/ubuntu-template
    path: kubernetes/platform/metallb

  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
