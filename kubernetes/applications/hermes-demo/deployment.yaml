apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-demo
  namespace: hermes-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hermes-demo
  template:
    metadata:
      labels:
        app: hermes-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
