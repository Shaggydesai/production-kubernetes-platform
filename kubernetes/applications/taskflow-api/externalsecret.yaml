apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: taskflow-api-secret
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: taskflow-api-credentials
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: taskflow-api
        property: jwt-secret
    - secretKey: db-password
      remoteRef:
        key: postgresql
        property: password
