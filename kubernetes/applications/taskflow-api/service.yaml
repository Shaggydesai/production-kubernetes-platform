apiVersion: v1
kind: Service
metadata:
  name: taskflow-api
  namespace: taskflow
  labels:
    # A ServiceMonitor's spec.selector matches SERVICE metadata labels, not
    # pod labels. Without this the ServiceMonitor selects nothing and there is
    # no target and no error - the failure is entirely silent.
    app: taskflow-api
spec:
  selector:
    app: taskflow-api
  ports:
    # Named because a ServiceMonitor references ports by name.
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
