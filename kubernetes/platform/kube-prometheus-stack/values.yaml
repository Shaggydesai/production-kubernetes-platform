kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 7d
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi

  prometheus-node-exporter:
    extraArgs:
      # chart defaults (must be repeated: Helm replaces lists)
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$'
      # host's /var/lib/node_exporter via the existing /host/root mount
      - '--collector.textfile.directory=/host/root/var/lib/node_exporter/textfile_collector'
                
  additionalPrometheusRulesMap:
    argocd:
      groups:
        - name: argocd
          rules:
            - alert: ArgoAppOutOfSync
              expr: argocd_app_info{sync_status="OutOfSync"} == 1
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: "Argo app {{ $labels.name }} OutOfSync for 30m"
                description: "Git and the cluster disagree and nothing is resolving it."
            - alert: ArgoAppDegraded
              expr: argocd_app_info{health_status="Degraded"} == 1
              for: 15m
              labels:
                severity: critical
              annotations:
                summary: "Argo app {{ $labels.name }} is Degraded"
            - alert: ArgoAppAutoSyncDisabled
              expr: argocd_app_info{autosync_enabled="false"} == 1
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "Argo app {{ $labels.name }} has auto-sync disabled"
                description: >-
                  Expected briefly during maintenance. Otherwise the app has
                  silently stopped following Git - this went undetected on
                  platform-vault for three days after the Sep 2026 recovery.
            - alert: ArgoMetricsMissing
              expr: absent(argocd_app_info)
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "No Argo CD metrics: the controller or its ServiceMonitor may be broken"
    taskflow-api:
      groups:
        - name: taskflow-api
          rules:
            - alert: TaskflowApiErrorRate
              expr: >-
                sum(rate(taskflow_http_requests_total{code=~"5..",
                route!~"/healthz|/readyz"}[5m]))
                / sum(rate(taskflow_http_requests_total{
                route!~"/healthz|/readyz"}[5m])) > 0.05
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "taskflow-api is returning over 5% 5xx"
                description: >-
                  Added after 2026-09-25, when every data endpoint returned 500
                  for eight hours against a schemaless database and nothing
                  alerted, because the app exposed no request metrics at all.
                  Probe routes are excluded: with two replicas they generate
                  ~20 requests/min, which would dilute a real spike in a lab
                  with almost no organic traffic below the threshold.
            - alert: TaskflowApiMostlyFailing
              expr: >-
                sum(rate(taskflow_http_requests_total{code=~"5..",
                route!~"/healthz|/readyz"}[5m]))
                / sum(rate(taskflow_http_requests_total{
                route!~"/healthz|/readyz"}[5m])) > 0.5
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "taskflow-api is failing more than half of all requests"
            - alert: TaskflowApiTargetDown
              expr: up{job="taskflow-api"} == 0
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Prometheus cannot scrape taskflow-api {{ $labels.instance }}"
                description: >-
                  Check the metrics port, the ServiceMonitor's release label and
                  allow-monitoring-to-taskflow-api-metrics.
            - alert: TaskflowApiMetricsMissing
              expr: absent(up{job="taskflow-api"})
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: "No taskflow-api scrape target exists at all"
                description: >-
                  The ServiceMonitor is missing, mislabelled, or selecting
                  nothing. Deliberately on 'up' rather than on a request
                  counter: an idle app legitimately reports no requests.
            - alert: TaskflowApiNoAvailableReplicas
              expr: >-
                kube_deployment_status_replicas_available{namespace="taskflow",
                deployment="taskflow-api"} < 1
              for: 10m
              labels:
                severity: critical
              annotations:
                summary: "taskflow-api has no available replicas"
    workload-restarts:
      groups:
        - name: workload-restarts
          rules:
            # KubePodCrashLooping only catches containers stuck in
            # CrashLoopBackOff. kube-controller-manager restarted 47 times on
            # 2026-09-25 while running fine for minutes between each exit, so
            # the backoff kept resetting and nothing ever fired - for three
            # days. These catch restart RATE instead of crash state.
            - alert: ControlPlaneComponentRestarting
              expr: >-
                increase(kube_pod_container_status_restarts_total{namespace="kube-system",
                pod=~"(kube-apiserver|kube-controller-manager|kube-scheduler|etcd)-.*"}[1h]) > 2
              for: 10m
              labels:
                severity: critical
              annotations:
                summary: "{{ $labels.pod }} restarted {{ $value | printf \"%.0f\" }} times in the last hour"
                description: >-
                  A control-plane component is not staying up. Check for
                  leader-election lease timeouts, which on slow disks look like
                  this. See docs/incidents/2026-09-25-host-sleep.md
            - alert: PodRestartingRepeatedly
              expr: increase(kube_pod_container_status_restarts_total[1h]) > 5
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted {{ $value | printf \"%.0f\" }} times in the last hour"
    etcd-disk:
      groups:
        - name: etcd-disk
          rules:
            - record: lab:etcd_wal_fsync_p99
              expr: histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))
            - record: lab:etcd_backend_commit_p99
              expr: histogram_quantile(0.99, rate(etcd_disk_backend_commit_duration_seconds_bucket[5m]))
            - alert: EtcdDiskCriticallySlow
              expr: lab:etcd_wal_fsync_p99 > 1
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "etcd WAL fsync p99 {{ $value | humanizeDuration }} on {{ $labels.instance }}"
                description: >-
                  etcd is waiting over a second on disk. Known cause: VMs on HDD.
                  Accepted risk pending SSD migration (postmortem item 14).
                  Expect API timeouts while this fires.
    etcd-database:
      groups:
        - name: etcd-database
          rules:
            - alert: EtcdDatabaseQuotaApproaching
              expr: etcd_mvcc_db_total_size_in_bytes / etcd_server_quota_backend_bytes > 0.6
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "etcd db at {{ $value | humanizePercentage }} of backend quota"
                description: >-
                  At 100% etcd goes READ-ONLY and the cluster stops accepting writes.
                  Check fragmentation first: a defrag usually reclaims most of it.
                  Runbook: docs/runbooks/etcd-backup-restore.md

            - alert: EtcdDatabaseHighFragmentation
              expr: >-
                (etcd_mvcc_db_total_size_in_bytes - etcd_mvcc_db_total_size_in_use_in_bytes)
                / etcd_mvcc_db_total_size_in_bytes > 0.75
                and etcd_mvcc_db_total_size_in_bytes > 200e6
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "etcd db {{ $value | humanizePercentage }} reclaimable"
                description: "Weekly defrag timer should clear this. If it persists, check etcd-defrag.timer."

            - alert: EtcdDefragNotRunning
              expr: time() - etcd_defrag_last_success_timestamp_seconds > 1209600
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "etcd defrag job has not succeeded in 14 days"
    velero-offsite:
      groups:
        - name: velero-offsite
          rules:
            - alert: VeleroOffsiteCopyTooOld
              expr: time() - velero_offsite_last_success_timestamp_seconds > 36 * 3600
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: "Velero off-cluster copy is older than 36h"
                description: "Check: systemctl status velero-offsite.timer; journalctl -u velero-offsite"
            - alert: VeleroOffsiteMetricMissing
              expr: absent(velero_offsite_last_success_timestamp_seconds)
              for: 2h
              labels:
                severity: warning
              annotations:
                summary: "No off-cluster copy metric: the mirror job or node-exporter may be broken"
    velero:
      groups:
        - name: velero
          rules:
            - alert: VeleroBackupFailure
              expr: increase(velero_backup_failure_total[1h]) > 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Velero backup failures in the last hour: {{ $value }}"
                description: "Check: velero backup get; velero backup logs <name>"
            - alert: VeleroBackupPartialFailure
              expr: increase(velero_backup_partial_failure_total[1h]) > 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Velero partially failed backups in the last hour: {{ $value }}"
            - alert: VeleroBackupTooOld
              expr: time() - max by (schedule) (velero_backup_last_successful_timestamp) > 36 * 3600
              for: 30m
              labels:
                severity: critical
              annotations:
                summary: "No successful Velero backup for schedule {{ $labels.schedule }} in 36h"
                description: "Check the schedule and the node-agent pods in the velero namespace."
            - alert: VeleroBackupMetricMissing
              expr: absent(velero_backup_last_successful_timestamp)
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "No Velero backup metrics: Velero or its ServiceMonitor may be broken"
    etcd-backup:
      groups:
        - name: etcd-backup
          rules:
            - alert: EtcdBackupTooOld
              expr: time() - etcd_backup_last_success_timestamp_seconds > 8 * 3600
              for: 10m
              labels:
                severity: critical
              annotations:
                summary: "etcd backup on {{ $labels.instance }} is older than 8h"
                description: "Last successful backup was {{ $value | humanizeDuration }} ago. Check: systemctl status etcd-backup.timer; journalctl -u etcd-backup"
            - alert: EtcdBackupMetricMissing
              expr: absent(etcd_backup_last_success_timestamp_seconds)
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "No etcd backup metric: backup script or node-exporter textfile collector broken"

  alertmanager:
    # The running config does NOT come from here. useExistingSecret +
    # configSecret below make the operator ignore any `config:` key in these
    # values. The live alertmanager.yaml is rendered by
    # kubernetes/platform/vault-config/externalsecret-alertmanager-config.yaml
    # Edit it there, not here.
    alertmanagerSpec:
      useExistingSecret: true
      configSecret: alertmanager-config  
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi

  grafana:
    persistence:
      enabled: true
      storageClassName: longhorn
      size: 5Gi
    admin:
      existingSecret: "grafana-admin-credentials"
      userKey: admin-user
      passwordKey: admin-password
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki-stack.monitoring.svc:3100
        access: proxy
        isDefault: false    
