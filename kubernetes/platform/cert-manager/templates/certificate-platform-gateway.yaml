apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-gateway-tls
  namespace: envoy-gateway-system
spec:
  secretName: platform-gateway-tls
  duration: 2160h
  renewBefore: 360h
  commonName: platform.example.internal
  dnsNames:
    - platform.example.internal
  issuerRef:
    name: platform-ca
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: RSA
    size: 2048
