apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-tls
  namespace: envoy-gateway-system
spec:
  secretName: argocd-tls
  duration: 2160h
  renewBefore: 360h
  commonName: argocd.platform.internal
  dnsNames:
    - argocd.platform.internal
  issuerRef:
    name: platform-ca
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: RSA
    size: 2048
