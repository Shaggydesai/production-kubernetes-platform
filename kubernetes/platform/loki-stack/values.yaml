loki-stack:
  loki:
    enabled: true
    isDefault: false
    persistence:
      enabled: true
      storageClassName: longhorn
      size: 10Gi
    config:
      table_manager:
        retention_deletes_enabled: true
        retention_period: 168h   # 7d, matches Prometheus retention — deliberate, lab-sized

  promtail:
    enabled: true

  grafana:
    enabled: false   # Grafana already exists via kube-prometheus-stack — don't install a second one
