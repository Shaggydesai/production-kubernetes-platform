apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: demo-app-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: demo-app-k8s-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: demo-app
        property: username
    - secretKey: password
      remoteRef:
        key: demo-app
        property: password
