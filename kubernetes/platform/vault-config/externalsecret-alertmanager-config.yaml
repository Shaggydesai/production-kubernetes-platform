apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            receiver: discord
            group_by: ['alertname', 'namespace']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            routes:
              - receiver: 'null'
                matchers: ['alertname = "Watchdog"']
              - receiver: 'null'
                matchers: ['alertname = "InfoInhibitor"']
              - receiver: 'null'
                matchers: ['severity = "info"']
              # TEMP: kubeadm binds control-plane metrics to 127.0.0.1.
              # Remove these two routes after the metrics-bind fix.
              - receiver: 'null'
                matchers: ['alertname =~ "KubeControllerManagerDown|KubeSchedulerDown|KubeProxyDown|etcdMembersDown|etcdInsufficientMembers"']
              - receiver: 'null'
                matchers: ['alertname = "TargetDown"', 'job =~ "kube-controller-manager|kube-scheduler|kube-proxy|kube-etcd"']
          receivers:
            - name: 'null'
            - name: discord
              discord_configs:
                - webhook_url: '{{ .webhookUrl }}'
                  send_resolved: true
          # chart default inhibit rules (we own the whole config now)
          inhibit_rules:
            - source_matchers: ['severity = "critical"']
              target_matchers: ['severity =~ "warning|info"']
              equal: ['namespace', 'alertname']
            - source_matchers: ['severity = "warning"']
              target_matchers: ['severity = "info"']
              equal: ['namespace', 'alertname']
            - source_matchers: ['alertname = "InfoInhibitor"']
              target_matchers: ['severity = "info"']
              equal: ['namespace']
            - target_matchers: ['alertname = "InfoInhibitor"']
  data:
    - secretKey: webhookUrl
      remoteRef:
        key: alertmanager
        property: discord-webhook-url
