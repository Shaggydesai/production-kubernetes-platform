apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            receiver: discord
            group_by: ['alertname', 'namespace']
            group_wait: 30s
            group_interval: 5m
            # Default cadence, for warnings. Deliberately long: this channel
            # received ~39 notifications in a day, and volume is what made a
            # 23h critical invisible on 2026-09-29. Criticals get their own
            # route below.
            repeat_interval: 24h
            routes:
              # DEAD-MAN'S SWITCH. Watchdog is the one alert that always fires
              # by design, so an external service that stops receiving it knows
              # this whole pipeline is dead. Previously routed to 'null', which
              # meant nothing anywhere could report that alerting had stopped.
              #
              # On 2026-09-27 BOTH ends were broken at once: an orphaned
              # container held hostNetwork port 9100 so node-exporter could not
              # bind and nothing was scraped, and Alertmanager's webhook served
              # a revoked URL. The correct alerts existed, the metric files were
              # on disk and current, and nothing arrived. Nothing could have
              # said so, because the only thing that would notice silence was
              # the system that had gone silent.
              #
              # repeat_interval is 5m and NOT inherited: the root is 24h, which
              # would ping once a day and give a detection time worse than the
              # outage. With a 15m grace period on the receiving end this
              # detects a dead alerting pipeline in under 20 minutes.
              #
              # group_interval MUST be well under repeat_interval, and that is
              # the whole reason this line exists. Alertmanager's dispatcher
              # flushes each alert group on a group_interval ticker and only
              # re-notifies if repeat_interval has already elapsed AT that tick.
              # With both set to 5m the tick keeps landing a moment before the
              # window opens, skips, and waits a whole further cycle.
              #
              # Measured on 2026-10-01 with group_interval inherited at 5m:
              # pings at 04:53:32 and ~04:58:32 (correct), then nothing for
              # about 14 minutes of unsilenced time. That is inside the 20m
              # tolerance by roughly a minute, so it would have false-alarmed
              # eventually - and a dead-man's switch that cries wolf gets
              # ignored, which is the failure it exists to prevent.
              #
              # What this catches: Prometheus down, Alertmanager down, a broken
              # or revoked webhook, lost egress. What it does NOT catch: a
              # target that silently stopped being scraped, because Watchdog is
              # vector(1) and fires regardless. That is what the nine absent()
              # alerts are for - and they only reach anyone if THIS pipeline
              # works, which is why the switch is the bottom of the stack
              # rather than one more alert on top of it.
              - receiver: heartbeat
                matchers: ['alertname = "Watchdog"']
                group_wait: 0s
                group_interval: 1m
                repeat_interval: 5m
              - receiver: 'null'
                matchers: ['alertname = "InfoInhibitor"']
              - receiver: 'null'
                matchers: ['severity = "info"']
              # Criticals re-notify hourly until they stop firing.
              #
              # On 2026-09-29 VeleroBackupTooOld was critical for 23 hours while
              # the application data had no backup for three days. Every rule
              # fired, routing worked, and Alertmanager delivered 72 of 72
              # notifications - but with repeat_interval 12h it said so ONCE, at
              # about 06:45, in the same stream as the day's warnings. The gap
              # was triage, not instrumentation, so the fix is cadence and not
              # another alert rule.
              - receiver: discord
                matchers: ['severity = "critical"']
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 1h
          receivers:
            - name: 'null'
            - name: discord
              discord_configs:
                - webhook_url: '{{ .webhookUrl }}'
                  send_resolved: true
            # The ping URL is a credential - anyone holding it can send a fake
            # heartbeat and keep the switch quiet - so it lives in Vault beside
            # the Discord webhook, never in Git. See ADR-005.
            #
            # send_resolved is false: Watchdog is not supposed to resolve, and a
            # resolve notification would be an extra ping that says nothing.
            - name: heartbeat
              webhook_configs:
                - url: '{{ .heartbeatUrl }}'
                  send_resolved: false
          # chart default inhibit rules (we own the whole config now)
          inhibit_rules:
            - source_matchers: ['severity = "critical"']
              target_matchers: ['severity =~ "warning|info"']
              equal: ['namespace', 'alertname']
            - source_matchers: ['severity = "warning"']
              target_matchers: ['severity = "info"']
              equal: ['namespace', 'alertname']
            - source_matchers: ['alertname = "InfoInhibitor"']
              target_matchers: ['severity = "info"']
              equal: ['namespace']
            - target_matchers: ['alertname = "InfoInhibitor"']
  data:
    - secretKey: webhookUrl
      remoteRef:
        key: alertmanager
        property: discord-webhook-url
    # Seed with: vault kv patch secret/alertmanager heartbeat-url=-
    # (patch, NOT put - put replaces the whole secret and would drop the
    # Discord webhook. Read on stdin so it never lands in shell history.)
    #
    # Until this property exists in Vault the ExternalSecret stays NotReady and
    # the Secret is not rewritten, so Alertmanager keeps its previous config.
    # Seed Vault BEFORE merging this.
    - secretKey: heartbeatUrl
      remoteRef:
        key: alertmanager
        property: heartbeat-url
