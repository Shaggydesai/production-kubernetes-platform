apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config-script
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
data:
  configure.sh: |
    #!/bin/sh
    set -e
    export VAULT_ADDR=http://vault.vault.svc:8200
    SA_JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login role=vault-configurator jwt="$SA_JWT")
    export VAULT_TOKEN
    echo "Logged in via Kubernetes auth (role vault-configurator)"


    echo "Configuring Kubernetes auth..."
    vault write auth/kubernetes/config \
      kubernetes_host="https://kubernetes.default.svc:443"

    echo "Writing external-secrets policy..."
    vault policy write external-secrets-policy - <<POLICY_EOF
    path "secret/data/*" {
      capabilities = ["read"]
    }
    POLICY_EOF

    echo "Binding role to vault-auth ServiceAccount..."
    vault write auth/kubernetes/role/external-secrets-role \
      bound_service_account_names=vault-auth \
      bound_service_account_namespaces=external-secrets \
      policies=external-secrets-policy \
      ttl=1h

    echo "Seeding demo secret (idempotent)..."
    if ! vault kv metadata get secret/demo-app >/dev/null 2>&1; then
      vault kv put secret/demo-app username=admin password=supersecret123
    else
      echo "secret/demo-app already exists, skipping"
    fi

    echo "Seeding Grafana admin credentials (idempotent)..."
    if ! vault kv metadata get secret/grafana >/dev/null 2>&1; then
      GRAFANA_PASSWORD=$(vault write -f -field=random_bytes sys/tools/random/20 format=base64)
      vault kv put secret/grafana admin-user=admin admin-password="$GRAFANA_PASSWORD"
    else
      echo "secret/grafana already exists, skipping"
    fi

    echo "Seeding PostgreSQL credentials (idempotent)..."
    if ! vault kv metadata get secret/postgresql >/dev/null 2>&1; then
      PG_ADMIN_PASSWORD=$(vault write -f -field=random_bytes sys/tools/random/20 format=base64)
      PG_USER_PASSWORD=$(vault write -f -field=random_bytes sys/tools/random/20 format=base64)
      vault kv put secret/postgresql postgres-password="$PG_ADMIN_PASSWORD" password="$PG_USER_PASSWORD"
    else
      echo "secret/postgresql already exists, skipping"
    fi

    echo "Seeding taskflow-api JWT secret (idempotent)..."
    if ! vault kv metadata get secret/taskflow-api >/dev/null 2>&1; then
      JWT_SECRET=$(vault write -f -field=random_bytes sys/tools/random/32 format=base64)
      vault kv put secret/taskflow-api jwt-secret="$JWT_SECRET"
    else
      echo "secret/taskflow-api already exists, skipping"
    fi

    echo "Seeding MinIO credentials (idempotent)..."
    if ! vault kv metadata get secret/minio >/dev/null 2>&1; then
      MINIO_ROOT_USER="minioadmin"
      MINIO_ROOT_PASSWORD=$(vault write -f -field=random_bytes sys/tools/random/20 format=base64)
      vault kv put secret/minio rootUser="$MINIO_ROOT_USER" rootPassword="$MINIO_ROOT_PASSWORD"
    else
      echo "secret/minio already exists, skipping"
    fi

    echo "Seeding Velero MinIO credentials (idempotent)..."
    if ! vault kv metadata get secret/velero >/dev/null 2>&1; then
      MINIO_ROOT_USER=$(vault kv get -field=rootUser secret/minio)
      MINIO_ROOT_PASSWORD=$(vault kv get -field=rootPassword secret/minio)
      CLOUD_CREDS=$(printf '[default]\naws_access_key_id=%s\naws_secret_access_key=%s' "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD")
      vault kv put secret/velero cloud="$CLOUD_CREDS"
    else
      echo "secret/velero already exists, skipping"
    fi
    echo "Vault configuration complete."

