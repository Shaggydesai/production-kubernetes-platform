apiVersion: batch/v1
kind: Job
metadata:
  name: vault-configure
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: vault-configure
          image: hashicorp/vault:1.19.0
          command: ["/bin/sh", "/scripts/configure.sh"]
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: root-token
              mountPath: /vault/root-token
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: vault-config-script
            defaultMode: 0755
        - name: root-token
          secret:
            secretName: vault-root-token
