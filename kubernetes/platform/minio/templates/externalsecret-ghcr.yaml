# GHCR pull credential for the mirrored MinIO image.
#
# quay.io/minio/minio and quay.io/minio/mc both began returning 401 to
# anonymous pulls in September 2026, and docker.io/minio/* refuses them too
# (verified 2026-09-28). The server image is therefore mirrored to
# ghcr.io/shaggydesai/minio from a local export; see docs/runbooks/rebuild.md.
#
# Reuses the SAME read-only token as taskflow-api, at Vault secret/ghcr. No new
# credential: read:packages is all a cluster ever needs, and a token a pod can
# reach must never be able to overwrite your images.
#
# The backticks are deliberate. This file lives in a Helm chart's templates/,
# so Helm renders it before ESO ever sees it. `{{ .username }}` is ESO's
# templating - unescaped, Helm would eat it and ESO would render a Secret
# authenticating as an empty user, which syncs green and cannot pull. The raw
# string passes it through untouched.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {{ `{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}` }}
  data:
    - secretKey: username
      remoteRef:
        key: ghcr
        property: username
    - secretKey: token
      remoteRef:
        key: ghcr
        property: token
