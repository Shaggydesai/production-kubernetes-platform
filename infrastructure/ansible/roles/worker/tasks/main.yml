---
- name: Has this node already joined?
  ansible.builtin.stat:
    path: "{{ worker_kubelet_conf }}"
  register: worker_kubelet

# A bootstrap token is a credential: anyone holding it can join a node to the
# cluster. It is generated only when a node actually needs it, and no_log keeps
# it out of the Ansible output, which otherwise ends up in terminals, CI logs
# and screenshots. Same rule as the age key and the Discord webhook.
- name: Mint a join command on the control plane
  ansible.builtin.command: >-
    kubeadm token create --print-join-command --ttl 30m
  delegate_to: "{{ groups['control_plane'] | first }}"
  register: worker_join_command
  changed_when: true
  no_log: true
  when: not worker_kubelet.stat.exists

- name: Join the cluster
  ansible.builtin.command: "{{ worker_join_command.stdout }} --cri-socket unix:///run/containerd/containerd.sock"
  register: worker_join
  changed_when: true
  no_log: true
  when: not worker_kubelet.stat.exists

- name: Confirm the node registered
  ansible.builtin.stat:
    path: "{{ worker_kubelet_conf }}"
  register: worker_kubelet_after

- name: Verify kubelet.conf exists after joining
  ansible.builtin.assert:
    that:
      - worker_kubelet_after.stat.exists
    fail_msg: >-
      {{ inventory_hostname }} did not join. The join output is suppressed
      because it contains a bootstrap token; re-run with -vvv and no_log
      temporarily removed, or look at: journalctl -u kubelet -n 50
