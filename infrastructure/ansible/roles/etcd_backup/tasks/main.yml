---
- name: Install age
  ansible.builtin.apt:
    name: age
    state: present

- name: Create backup reader group
  ansible.builtin.group:
    name: "{{ etcd_backup_group }}"
    state: present

- name: Let the admin user read backups
  ansible.builtin.user:
    name: "{{ etcd_backup_admin_user }}"
    groups: "{{ etcd_backup_group }}"
    append: true

- name: Create config directory
  ansible.builtin.file:
    path: /etc/etcd-backup
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install age recipient (public key only)
  ansible.builtin.copy:
    src: recipient.txt
    dest: /etc/etcd-backup/recipient.txt
    owner: root
    group: root
    mode: "0644"

- name: Create backup directory
  ansible.builtin.file:
    path: /var/backups/etcd
    state: directory
    owner: root
    group: "{{ etcd_backup_group }}"
    mode: "0750"

- name: Install backup script
  ansible.builtin.copy:
    src: etcd-backup.sh
    dest: /usr/local/sbin/etcd-backup.sh
    owner: root
    group: root
    mode: "0750"

- name: Install systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - etcd-backup.service
    - etcd-backup.timer
  notify: Reload systemd

- name: Apply systemd reload before touching the timer
  ansible.builtin.meta: flush_handlers

- name: Enable and start backup timer
  ansible.builtin.systemd:
    name: etcd-backup.timer
    enabled: true
    state: started

- name: Create read-only pull user
  ansible.builtin.user:
    name: "{{ etcd_backup_pull_user }}"
    shell: /bin/bash
    groups: "{{ etcd_backup_group }}"
    append: true
    create_home: true

- name: Create pull user's .ssh directory
  ansible.builtin.file:
    path: "/home/{{ etcd_backup_pull_user }}/.ssh"
    state: directory
    owner: "{{ etcd_backup_pull_user }}"
    group: "{{ etcd_backup_pull_user }}"
    mode: "0700"

- name: Restrict pull key to read-only SFTP from the laptop
  ansible.builtin.copy:
    content: "restrict,from=\"{{ etcd_backup_pull_from }}\",command=\"/usr/lib/openssh/sftp-server -R\" {{ etcd_backup_pull_pubkey }}\n"
    dest: "/home/{{ etcd_backup_pull_user }}/.ssh/authorized_keys"
    owner: "{{ etcd_backup_pull_user }}"
    group: "{{ etcd_backup_pull_user }}"
    mode: "0600"
