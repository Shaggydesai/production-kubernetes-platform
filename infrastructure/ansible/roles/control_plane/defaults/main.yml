---
control_plane_kubeadm_config: /etc/kubernetes/kubeadm-config.yaml
control_plane_admin_conf: /etc/kubernetes/admin.conf
# Who gets ~/.kube/config. Set cluster_admin_user in group_vars.
control_plane_kubeconfig_owner: "{{ cluster_admin_user | default(ansible_user) }}"

# kubeadm reads patches from here at init, and at upgrade when passed
# --patches. See files/patches/ and ADR-006 decision 4.
control_plane_patches_dir: /etc/kubernetes/patches
