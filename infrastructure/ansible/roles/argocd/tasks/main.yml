---
- name: Install Argo CD from the in-repo wrapper chart
  ansible.builtin.command:
    cmd: >
      helm upgrade --install {{ argocd_release_name }}
      {{ argocd_chart_path }}
      --namespace {{ argocd_namespace }}
      --create-namespace
      --wait
      --timeout 10m
  register: argocd_helm
  changed_when: "'has been upgraded' in argocd_helm.stdout or 'has been installed' in argocd_helm.stdout"

- name: Report the deployed chart
  ansible.builtin.debug:
    msg: "{{ argocd_helm.stdout_lines | select('search', 'CHART|REVISION|STATUS') | list }}"
