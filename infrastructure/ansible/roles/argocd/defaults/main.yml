---
argocd_namespace: argocd
argocd_release_name: argocd

# Install the in-repo wrapper chart, NOT the upstream chart directly.
# The wrapper pins argo-cd as a vendored dependency (charts/*.tgz) and adds
# platform templates (the HTTPRoute). Its values.yaml is the SINGLE source of
# Argo CD configuration - there is deliberately no values template here.
argocd_chart_path: "{{ playbook_dir }}/../../../kubernetes/platform/argocd"
