---
# VMware's emulated e1000 NIC hangs its transmit ring under load
# ("Detected Tx Unit Hang"), which takes the node off the network entirely.
# Disabling segmentation/checksum offloads avoids it.
#
# On KVM the guests use virtio, which is paravirtualised - there is no emulated
# NIC with a transmit ring to hang - so the workaround is off by default and
# these tasks are skipped. Set node_tuning_vmware_nic_workaround: true only if
# the guests are still running under VMware Workstation.
#
# Observed on 2026-09-24 (after the host slept) and again on 2026-09-26 under
# plain sustained I/O. See docs/incidents/2026-09-25-host-sleep.md and
# ADR-006 decision 1.

- name: Ensure ethtool is installed
  ansible.builtin.apt:
    name: ethtool
    state: present
  when: node_tuning_vmware_nic_workaround | default(false) | bool

- name: Install NIC offload unit
  ansible.builtin.copy:
    src: nic-offload-off.service
    dest: /etc/systemd/system/nic-offload-off.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  when: node_tuning_vmware_nic_workaround | default(false) | bool

- name: Apply systemd reload before enabling the unit
  ansible.builtin.meta: flush_handlers

- name: Enable and apply NIC offload settings
  ansible.builtin.systemd:
    name: nic-offload-off.service
    enabled: true
    state: started
  when:
    - node_tuning_vmware_nic_workaround | default(false) | bool
    - not ansible_check_mode      # the unit file does not exist during --check

# The inotify limits are NOT VMware-specific: Kubernetes workloads exhaust the
# defaults on any hypervisor, so this always applies.
- name: Raise inotify limits for Kubernetes workloads
  ansible.builtin.copy:
    src: 99-k8s-inotify.conf
    dest: /etc/sysctl.d/99-k8s-inotify.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl settings
