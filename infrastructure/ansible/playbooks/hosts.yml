---
- name: Node metrics prerequisites
  hosts: all
  become: true
  roles:
    - node_metrics

- name: etcd backups on the control plane
  hosts: control_plane
  become: true
  roles:
    - etcd_backup

- name: Expose control-plane metrics to Prometheus
  hosts: control_plane
  become: true
  roles:
    - control_plane_metrics

- name: Off-cluster copy of Velero backups
  hosts: control_plane
  become: true
  roles:
    - velero_offsite
