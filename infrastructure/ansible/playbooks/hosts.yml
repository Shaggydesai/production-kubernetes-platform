---
- name: Node metrics prerequisites
  hosts: all
  become: true
  roles:
    - node_metrics

- name: etcd backups on the control plane
  hosts: control_plane
  become: true
  roles:
    - etcd_backup

- name: Expose control-plane metrics to Prometheus
  hosts: control_plane
  become: true
  roles:
    - control_plane_metrics

- name: Off-cluster copy of Velero backups
  hosts: control_plane
  become: true
  roles:
    - velero_offsite

- name: Node tuning (VMware NIC workaround)
  hosts: all
  become: true
  roles:
    - node_tuning

- name: Configure etcd defragmentation
  hosts: control_plane
  become: true
  roles:
    - etcd_defrag      
