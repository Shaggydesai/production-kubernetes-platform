name: manifests CI

on:
  push:
    branches: [main]
    paths:
      - 'kubernetes/**'
      - 'infrastructure/ansible/**'
      - '.github/workflows/manifests-ci.yml'
  # No paths filter on pull_request, deliberately - same reason as
  # taskflow-api-ci.yml. A filtered workflow never starts on an unrelated PR, so
  # any job here that is later made a required status check would sit "expected"
  # forever and block the merge. These jobs are hermetic and take about a minute.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  charts:
    name: helm lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      # Every chart's dependencies are vendored as .tgz under charts/, so this
      # needs no network and no `helm repo add`.
      - name: Lint and render every platform chart
        run: |
          set -uo pipefail
          rc=0
          mkdir -p /tmp/rendered
          for dir in kubernetes/platform/*/; do
            name=$(basename "$dir")
            [ -f "$dir/Chart.yaml" ] || { echo "skip $name (plain manifests)"; continue; }
            echo "::group::$name"
            helm lint "$dir" || rc=1
            helm template "$name" "$dir" > "/tmp/rendered/$name.yaml" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      # 2026-09-28: an ExternalSecret placed in a chart's templates/ has ESO's
      # own {{ .username }} eaten by Helm unless it is wrapped in a raw string.
      # The result renders green and produces a Secret that authenticates as
      # nobody. Assert the literal survives.
      - name: ESO templating must survive Helm rendering
        run: |
          grep -q '{{ .username }}' /tmp/rendered/minio.yaml || {
            echo "Helm consumed ESO's template - see minio/templates/externalsecret-ghcr.yaml"
            exit 1
          }

      # quay.io/minio has returned 401 to anonymous pulls since Sept 2026, so
      # neither the server image nor quay.io/minio/mc can be pulled. The mc
      # *binary* does exist - it ships inside the MinIO server image mirrored to
      # GHCR - it is the mc *image* that is unobtainable. An earlier version of
      # this comment said no copy of mc existed anywhere, which was wrong.
      # Setting
      # `buckets: []` did NOT suppress the chart's mc Job - four other values
      # also gate it. If it ever comes back, break the build, not the cluster.
      - name: No manifest may PULL from quay.io/minio
        run: |
          set -uo pipefail
          # Image fields only. Our own comments name this registry when
          # explaining why it is banned, and Helm passes template comments
          # through to rendered output - matching those would fail the check for
          # the wrong reason, which is how this step was first written.
          if grep -rhoE 'image:[[:space:]]*"?[^"[:space:]]+' /tmp/rendered/ \
               | sed -E 's/image:[[:space:]]*"?//' \
               | grep -E '^quay\.io/minio'; then
            echo "quay.io/minio is unreachable (401 since Sept 2026) - mirror the image to GHCR and pin it"
            exit 1
          fi

      # 2026-09-29: chart 5.4.0's post-install Job creates a consoleAdmin
      # account - console/console123 - by invoking createUser in a mounted
      # ConfigMap script. Rendering the chart as it stood at install (79d7a44)
      # proved the account was declared in plaintext by a manifest we applied.
      # It was nonetheless absent from the running server, and what created the
      # velero-backups bucket on 2026-09-20 remains unknown - no commit touches
      # MinIO between 09-10 and 09-28.
      #
      # Asserted structurally rather than by credential string: a later chart
      # may name the account something other than console, but it would still
      # invoke createUser in the same script. Both patterns were checked against
      # the at-install render (1 each) and the current one (0 each) before being
      # written here - a check never run against known-bad input is not a check.
      - name: No manifest may declare a MinIO user
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import os, pathlib, re, sys, yaml
          d = pathlib.Path(os.environ.get("RENDER_DIR", "/tmp/rendered"))
          invoke = re.compile(r"^\s*createUser\s+[A-Za-z]")
          bad, configmaps = [], 0
          for f in sorted(d.glob("*.yaml")):
              for doc in yaml.safe_load_all(f.read_text()):
                  if not isinstance(doc, dict):
                      continue
                  name = (doc.get("metadata") or {}).get("name", "?")
                  if doc.get("kind") == "Job" and name == "minio-post-job":
                      bad.append(f"{f.name}: Job/{name} is back - not all five gate values in minio/values.yaml are pinned")
                  if doc.get("kind") == "ConfigMap":
                      configmaps += 1
                      for key, val in (doc.get("data") or {}).items():
                          if not isinstance(val, str):
                              continue
                          for i, line in enumerate(val.splitlines(), 1):
                              if invoke.match(line):
                                  bad.append(f"{f.name}: ConfigMap/{name} key {key!r} line {i}: {line.strip()!r}")
          # Never pass vacuously: the minio chart always renders a ConfigMap, so
          # zero means the render or this glob is broken, not that we are clean.
          assert configmaps > 0, f"no ConfigMap found under {d} - this check is looking at nothing"
          for b in bad:
              print("FAIL:", b)
          print(f"checked {configmaps} ConfigMaps under {d}: {len(bad)} violation(s)")
          sys.exit(1 if bad else 0)
          PY

      # MinIOUndeclaredBucket carries a literal list of declared bucket names,
      # and bucketProvisioning.buckets in the minio chart carries the same list.
      # Two copies of one fact drift: that is how "mc cannot be mirrored" came to
      # be written in three places, two of them wrong. This asserts they agree,
      # so adding a bucket fails the build until both files are updated, instead
      # of paging until someone works out which file to edit.
      #
      # Also requires an absent() alert per declared bucket, so a second bucket
      # cannot be declared without gaining the same protection as the first.
      - name: MinIO bucket alerts must match the declared buckets
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import re, sys, yaml

          minio = yaml.safe_load(open("kubernetes/platform/minio/values.yaml"))
          declared = sorted(minio["bucketProvisioning"]["buckets"])
          assert declared, "bucketProvisioning.buckets is empty - nothing to reconcile"

          kps = yaml.safe_load(open("kubernetes/platform/kube-prometheus-stack/values.yaml"))
          rmap = kps.get("kube-prometheus-stack", kps)["additionalPrometheusRulesMap"]
          rules = {r["alert"]: " ".join(r["expr"].split())
                   for e in rmap.values() for g in e["groups"]
                   for r in g["rules"] if "alert" in r}

          bad = []
          expr = rules.get("MinIOUndeclaredBucket")
          if not expr:
              bad.append("MinIOUndeclaredBucket is missing entirely")
          else:
              m = re.search(r'bucket!~"([^"]*)"', expr)
              if not m:
                  bad.append(f'MinIOUndeclaredBucket has no bucket!~"..." matcher: {expr}')
              else:
                  in_alert = sorted(x for x in m.group(1).split("|") if x)
                  if in_alert != declared:
                      bad.append(f"values.yaml declares {declared} but the alert excludes {in_alert}")

          for b in declared:
              if not any(f'bucket="{b}"' in e and e.startswith("absent(")
                         for e in rules.values()):
                  bad.append(f"no absent() alert covers declared bucket {b!r}")

          for x in bad:
              print("FAIL:", x)
          print(f"declared buckets: {declared}  alerts checked: {len(rules)}")
          sys.exit(1 if bad else 0)
          PY

      # The claim "mc cannot be mirrored / no copy of it exists anywhere" is
      # FALSE. /usr/bin/mc ships inside the MinIO server image mirrored to GHCR;
      # only the quay.io/minio/mc IMAGE is unobtainable.
      #
      # It reached nine occurrences across four files, and TWO manual cleanups
      # reported the repo clean while copies remained:
      #   - the first grepped the exact phrasings already seen, and every author
      #     had re-worded the claim
      #   - the second was line-based, and in job-create-bucket.yaml the claim
      #     wrapped as "no local copy exists" / "anywhere" over two lines
      # So this strips comment markers and flattens each file before matching.
      #
      # This file is excluded by name: it must contain the banned wording in
      # order to ban it. Not a loophole - the only way a check can state what it
      # forbids.
      - name: No file may claim mc cannot be mirrored
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          CLAIMS = [
              r'(?:never|cannot|could not|can not) be mirrored',
              r'impossible to mirror',
              r'no (?:local )?copy[^.]{0,40}(?:exists?|existed) anywhere',
              r'no (?:local )?copy of mc anywhere',
          ]
          SKIP_NAMES = {'manifests-ci.yml'}
          EXTS = {'.yml', '.yaml', '.md', '.sh', '.txt'}
          bad, scanned = [], 0
          for p in sorted(pathlib.Path('.').rglob('*')):
              if not p.is_file() or '.git' in p.parts or 'charts' in p.parts:
                  continue
              if p.suffix not in EXTS or p.name in SKIP_NAMES:
                  continue
              scanned += 1
              lines = [re.sub(r'^\s*#\s?', '', ln)
                       for ln in p.read_text(errors='replace').splitlines()]
              flat = ' '.join(' '.join(lines).split())
              for pat in CLAIMS:
                  for m in re.finditer(pat, flat, re.I):
                      bad.append((str(p), flat[max(0, m.start() - 70): m.end() + 30]))
          for path, ctx in bad:
              print(f"FAIL {path}")
              print(f"     ...{ctx}...")
          print(f"scanned {scanned} files, {len(bad)} violation(s)")
          assert scanned > 0, "scanned nothing - the file glob is broken"
          if bad:
              print()
              print("The mc BINARY ships inside the MinIO server image already mirrored")
              print("to GHCR. Only the quay.io/minio/mc IMAGE is unobtainable.")
          sys.exit(1 if bad else 0)
          PY

  rules:
    name: promtool check rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Fetch promtool
        run: |
          set -euo pipefail
          V=3.0.1
          curl -fsSL -o /tmp/p.tgz \
            "https://github.com/prometheus/prometheus/releases/download/v${V}/prometheus-${V}.linux-amd64.tar.gz"
          tar -xzf /tmp/p.tgz -C /tmp
          sudo install "/tmp/prometheus-${V}.linux-amd64/promtool" /usr/local/bin/

      # Alert rules are hand-edited in a Helm values file and were previously
      # validated by nothing but a YAML round-trip, which cannot catch a bad
      # PromQL expression.
      - name: Extract and check the alert rules
        run: |
          set -euo pipefail
          helm template kps kubernetes/platform/kube-prometheus-stack > /tmp/kps.yaml
          python3 - <<'PY'
          import yaml, pathlib
          out = pathlib.Path("/tmp/rules"); out.mkdir(exist_ok=True)
          n = 0
          for doc in yaml.safe_load_all(open("/tmp/kps.yaml")):
              if isinstance(doc, dict) and doc.get("kind") == "PrometheusRule":
                  n += 1
                  out.joinpath(doc["metadata"]["name"] + ".yaml").write_text(
                      yaml.safe_dump(doc["spec"]))
          print("extracted", n, "PrometheusRule objects")
          # Never let this pass vacuously: zero extracted means the extraction
          # is broken, which would silently stop checking anything.
          assert n > 0, "no PrometheusRule rendered - extraction is wrong"
          PY
          promtool check rules /tmp/rules/*.yaml

  ansible:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned to exactly what cp01 runs, both packages.
      #
      # A floor pin is not a pin: 'ansible-core>=2.16' let pip install the
      # newest core, which removed ansible.parsing.yaml.constructor, and
      # ansible-lint 24 cannot import it. The job died in 12 seconds on a
      # ModuleNotFoundError.
      #
      # Exact pins also mean CI agrees with the local linter - findings you
      # cannot reproduce are worse than no findings - and that a new upstream
      # release cannot turn main red without anything in this repo changing.
      - run: pip install 'ansible-core==2.16.3' 'ansible-lint==6.17.2'
      - name: Lint the roles
        working-directory: infrastructure/ansible
        run: ansible-lint --profile production
