name: image availability

# Can every image this platform deploys still be pulled?
#
# Upstream withdrawal has broken this project three times: dl.min.io started
# returning HTTP 410, then quay.io/minio/minio began returning 401, then
# quay.io/minio/mc did too - and we hold no archive of the mc image, so the
# chart's bucket Job cannot run. (The mc binary itself survives inside the
# mirrored server image, verified 2026-09-30; an earlier version of this comment
# asserted otherwise.) Each was discovered by a component failing, not by anyone
# asking the question.
#
# A registry allowlist would have caught none of them: quay.io/minio was already
# in use for the server image when mc appeared. The check has to be manifest
# existence, not registry identity.
#
# Not in the PR gate on purpose. Roughly 15 of these are on Docker Hub, whose
# anonymous rate limit is per-IP and shared across GitHub's runners, so this
# would be an intermittently red required check - which is worse than no check.
# Daily is enough: the question is "is this still rebuildable", not "did this
# commit break it".

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  pullable:
    name: every image resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      # Our own GHCR packages are private, so this is required to check them.
      # The minio mirror was pushed with a PAT, which does not link a package to
      # a repository, so GITHUB_TOKEN was "denied" on it until the package was
      # granted Actions read access to this repo in its own settings. A failure
      # on one of our images is now a real failure, not a standing exemption -
      # and no continue-on-error here, because a login that fails silently would
      # turn every one of our images into a false alarm.
      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | skopeo login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Collect every image the charts render
        run: |
          set -euo pipefail
          for dir in kubernetes/platform/*/; do
            [ -f "$dir/Chart.yaml" ] || continue
            helm template "$(basename "$dir")" "$dir" 2>/dev/null || true
          done > /tmp/rendered.yaml
          grep -ohE 'image:[[:space:]]*"?[^"[:space:]]+' /tmp/rendered.yaml \
            | sed -E 's/image:[[:space:]]*"?//' | sort -u > /tmp/images.txt
          echo "found $(wc -l < /tmp/images.txt) distinct images"
          cat /tmp/images.txt
          # Never pass vacuously: an extraction that finds nothing would report
          # a clean bill of health forever.
          test "$(wc -l < /tmp/images.txt)" -ge 20

      - name: Resolve each manifest
        run: |
          set -uo pipefail
          hard=0; throttled_count=0; total=0
          while read -r img; do
            [ -n "$img" ] || continue
            total=$((total + 1))
            ok=0; throttled=0
            for attempt in 1 2 3; do
              if err=$(skopeo inspect --raw --override-os linux --override-arch amd64 \
                         "docker://$img" 2>&1 >/dev/null); then
                ok=1; break
              fi
              case "$err" in
                *toomanyrequests*|*"Data limit exceeded"*|*"rate limit"*|*" 429 "*)
                  throttled=1 ;;
                *) throttled=0 ;;
              esac
              [ "$attempt" = 3 ] && break
              sleep $((attempt * 15))
            done
            if [ "$ok" = 1 ]; then
              printf 'OK           %s\n' "$img"
            elif [ "$throttled" = 1 ]; then
              # A rate limit is not evidence the image is gone. AWS public ECR
              # and Docker Hub both throttle anonymous requests from GitHub's
              # shared runner IPs - ecr-public hit "Data limit exceeded" on
              # 2026-09-29 for an image that resolved fine from a laptop
              # moments later. Failing on this would make a daily check cry
              # wolf, and today established that notification volume is what
              # buried a real critical alert for 23 hours.
              printf 'INCONCLUSIVE %s (rate limited)\n' "$img"
              throttled_count=$((throttled_count + 1))
            else
              printf -- '---- FULL ERROR for %s ----\n%s\n---- end ----\n' "$img" "$err"
              printf '::error::%s cannot be pulled - see FULL ERROR in the log\n' "$img"
              hard=$((hard + 1))
            fi
          done < /tmp/images.txt

          echo "---- $total checked, $hard unresolvable, $throttled_count inconclusive"

          # If much of the run was throttled it proved nothing, and silence
          # would read as a clean bill of health.
          if [ "$throttled_count" -gt 5 ]; then
            printf '::error::%s of %s images were rate limited - this run proved nothing\n' \
              "$throttled_count" "$total"
            exit 1
          fi
          exit $hard
