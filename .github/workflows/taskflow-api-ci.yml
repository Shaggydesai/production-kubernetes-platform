name: taskflow-api CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/taskflow-api/**'
      - '.github/workflows/taskflow-api-ci.yml'
  # No paths filter here on purpose: `test` is a required status check, and a
  # filtered workflow never starts on unrelated PRs, so the check would sit
  # "expected" forever and block the merge.
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/shaggydesai/taskflow-api

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/taskflow-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/taskflow-api/go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v

  build-and-push:
    needs: test
    # never build or publish from a pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps/taskflow-api
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE_NAME }}:latest

      # main is protected, so CI cannot push to it. Open a PR instead: one path
      # into main, and the manifest bump is reviewable like any other change.
      # Longer term this job goes away in favour of Argo CD Image Updater with
      # write-back-method: argocd, which needs no Git write at all.
      #
      # The token below comes from a GitHub App, NOT secrets.GITHUB_TOKEN.
      # GitHub suppresses workflow runs for events caused by GITHUB_TOKEN (its
      # anti-recursion rule), so a bump PR opened with it never receives the
      # required 'test' check and can never be merged. On 2026-09-25/26 every
      # bump PR had to be unblocked by hand with an empty commit pushed under a
      # user credential. An App installation token is not subject to that rule,
      # is minted per run, and expires in an hour - so nothing long-lived is
      # stored anywhere.
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Open a PR with the new image tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          sed -i "s|image: ${{ env.IMAGE_NAME }}:.*|image: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}|" \
            kubernetes/applications/taskflow-api/deployment.yaml \
            kubernetes/applications/taskflow-api/job-migrate.yaml

          if git diff --quiet; then
            echo "manifest already at ${{ steps.vars.outputs.sha_short }}, nothing to do"
            exit 0
          fi

          BRANCH="ci/bump-taskflow-api-${{ steps.vars.outputs.sha_short }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add kubernetes/applications/taskflow-api/deployment.yaml \
                  kubernetes/applications/taskflow-api/job-migrate.yaml
          git commit -m "ci: bump taskflow-api image to ${{ steps.vars.outputs.sha_short }}"
          # actions/checkout persisted GITHUB_TOKEN credentials. Push as the App
          # instead, so the branch and the PR are both attributed to it and the
          # pull_request event actually fires.
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "ci: bump taskflow-api image to ${{ steps.vars.outputs.sha_short }}" \
            --body "Automated image bump from ${{ github.sha }}. Merging this is what actually deploys it."
