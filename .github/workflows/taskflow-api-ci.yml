name: taskflow-api CI/CD

on:
  push:
    branches: [feature/ubuntu-template]
    paths:
      - 'apps/taskflow-api/**'
      - '.github/workflows/taskflow-api-ci.yml'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/taskflow-api

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/taskflow-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/taskflow-api/go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps/taskflow-api
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update GitOps manifest with new image tag
        run: |
          sed -i "s|image: ${{ env.IMAGE_NAME }}:.*|image: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}|" \
            kubernetes/applications/taskflow-api/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/applications/taskflow-api/deployment.yaml
          git diff --staged --quiet || git commit -m "ci: bump taskflow-api image to ${{ steps.vars.outputs.sha_short }}"
          git push
